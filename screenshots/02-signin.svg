<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 580" width="280" height="580" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <radialGradient id="aurora2" cx="85%" cy="90%" r="60%"><stop offset="0%" stop-color="#2E7D52" stop-opacity=".22"/><stop offset="100%" stop-color="#2E7D52" stop-opacity="0"/></radialGradient>
    <linearGradient id="btn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a8f63"/><stop offset="100%" stop-color="#2E7D52"/></linearGradient>
  </defs>
  <rect width="280" height="580" rx="36" fill="#0a121b"/>
  <rect x="6" y="6" width="268" height="568" rx="30" fill="#1C2B3A"/>
  <rect x="6" y="6" width="268" height="568" rx="30" fill="url(#aurora2)"/>

  <!-- Status bar -->
  <text x="24" y="30" fill="#F7FAF8" font-size="10" font-weight="600">9:41</text>
  <rect x="256" y="20" width="14" height="8" rx="2" stroke="#F7FAF8" stroke-width="1" fill="none"/><rect x="258" y="22" width="9" height="4" fill="#F7FAF8"/>

  <!-- Top bar -->
  <rect x="20" y="50" width="34" height="34" rx="17" fill="#2E7D52" fill-opacity=".15" stroke="#2E7D52" stroke-opacity=".25"/>
  <text x="32" y="73" fill="#F7FAF8" font-size="16" font-weight="700">←</text>
  <text x="64" y="68" fill="#F7FAF8" font-size="18" font-weight="800" letter-spacing="-.5">Sign in.</text>
  <text x="64" y="82" fill="#F7FAF8" fill-opacity=".62" font-size="10">Welcome back, Tino</text>

  <!-- Form card -->
  <rect x="20" y="110" width="240" height="170" rx="18" fill="#264c3f" fill-opacity=".18" stroke="#2E7D52" stroke-opacity=".22"/>
  <text x="36" y="138" fill="#F7FAF8" fill-opacity=".4" font-size="9" font-weight="700" letter-spacing="1.4">EMAIL</text>
  <text x="36" y="158" fill="#F7FAF8" font-size="12">tino@aperture.bank</text>
  <line x1="36" y1="170" x2="244" y2="170" stroke="#F7FAF8" stroke-opacity=".15"/>

  <text x="36" y="200" fill="#F7FAF8" fill-opacity=".4" font-size="9" font-weight="700" letter-spacing="1.4">PASSWORD</text>
  <text x="36" y="222" fill="#F7FAF8" font-size="14" letter-spacing="2">••••••••••</text>
  <circle cx="232" cy="217" r="2" fill="none" stroke="#F7FAF8" stroke-opacity=".5"/>
  <line x1="36" y1="232" x2="244" y2="232" stroke="#F7FAF8" stroke-opacity=".15"/>

  <text x="244" y="258" fill="#2E7D52" font-size="10" font-weight="600" text-anchor="end">Forgot password?</text>

  <!-- Sign in button -->
  <rect x="20" y="296" width="240" height="48" rx="24" fill="url(#btn2)"/>
  <text x="140" y="325" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Sign in</text>

  <!-- OR divider -->
  <line x1="20" y1="368" x2="120" y2="368" stroke="#F7FAF8" stroke-opacity=".15"/>
  <text x="140" y="372" fill="#F7FAF8" fill-opacity=".4" font-size="9" font-weight="700" text-anchor="middle">OR</text>
  <line x1="160" y1="368" x2="260" y2="368" stroke="#F7FAF8" stroke-opacity=".15"/>

  <!-- Face ID -->
  <rect x="20" y="386" width="240" height="48" rx="14" fill="#264c3f" fill-opacity=".18" stroke="#2E7D52" stroke-opacity=".22"/>
  <circle cx="42" cy="410" r="10" fill="none" stroke="#2E7D52" stroke-width="1.5"/>
  <text x="62" y="416" fill="#F7FAF8" font-size="12" font-weight="500">Face ID / Touch ID</text>

  <!-- Passkey -->
  <rect x="20" y="446" width="240" height="48" rx="14" fill="#264c3f" fill-opacity=".18" stroke="#2E7D52" stroke-opacity=".22"/>
  <circle cx="42" cy="470" r="6" stroke="#F7FAF8" stroke-opacity=".5" stroke-width="1.5" fill="none"/>
  <line x1="42" y1="476" x2="42" y2="486" stroke="#F7FAF8" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="62" y="476" fill="#F7FAF8" font-size="12" font-weight="500">Use Passkey</text>
</svg>
