<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 580" width="280" height="580" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <radialGradient id="asd" cx="85%" cy="90%" r="70%"><stop offset="0%" stop-color="#2E7D52" stop-opacity=".22"/><stop offset="100%" stop-color="#2E7D52" stop-opacity="0"/></radialGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a8f63"/><stop offset="100%" stop-color="#2E7D52"/></linearGradient>
  </defs>
  <rect width="280" height="580" rx="36" fill="#0a121b"/>
  <rect x="6" y="6" width="268" height="568" rx="30" fill="#1C2B3A"/>
  <rect x="6" y="6" width="268" height="568" rx="30" fill="url(#asd)"/>
  <text x="24" y="30" fill="#F7FAF8" font-size="10" font-weight="600">9:41</text>
  <rect x="256" y="20" width="14" height="8" rx="2" stroke="#F7FAF8" stroke-width="1" fill="none"/><rect x="258" y="22" width="9" height="4" fill="#F7FAF8"/>

  <!-- Top bar with back -->
  <rect x="20" y="50" width="34" height="34" rx="17" fill="#2E7D52" fill-opacity=".15" stroke="#2E7D52" stroke-opacity=".25"/>
  <text x="32" y="73" fill="#F7FAF8" font-size="16" font-weight="700">←</text>
  <text x="64" y="68" fill="#F7FAF8" font-size="18" font-weight="800" letter-spacing="-.5">Send money</text>
  <text x="64" y="82" fill="#F7FAF8" fill-opacity=".62" font-size="10">Select contact &amp; amount</text>

  <!-- Contacts row -->
  <g transform="translate(20,108)">
    <g><circle cx="22" cy="22" r="22" fill="#2E7D52" fill-opacity=".22" stroke="#2E7D52" stroke-width="2"/><text x="22" y="28" fill="#2E7D52" font-size="14" font-weight="800" text-anchor="middle">M</text><text x="22" y="60" fill="#F7FAF8" font-size="9" font-weight="600" text-anchor="middle">Mike</text></g>
    <g transform="translate(54,0)"><circle cx="22" cy="22" r="20" fill="#264c3f" fill-opacity=".4"/><text x="22" y="28" fill="#F7FAF8" fill-opacity=".7" font-size="13" font-weight="700" text-anchor="middle">P</text><text x="22" y="60" fill="#F7FAF8" fill-opacity=".62" font-size="9" text-anchor="middle">Pawan</text></g>
    <g transform="translate(108,0)"><circle cx="22" cy="22" r="20" fill="#264c3f" fill-opacity=".4"/><text x="22" y="28" fill="#F7FAF8" fill-opacity=".7" font-size="13" font-weight="700" text-anchor="middle">D</text><text x="22" y="60" fill="#F7FAF8" fill-opacity=".62" font-size="9" text-anchor="middle">Dash</text></g>
    <g transform="translate(162,0)"><circle cx="22" cy="22" r="20" fill="#264c3f" fill-opacity=".4"/><text x="22" y="28" fill="#F7FAF8" fill-opacity=".7" font-size="13" font-weight="700" text-anchor="middle">C</text><text x="22" y="60" fill="#F7FAF8" fill-opacity=".62" font-size="9" text-anchor="middle">Chizi</text></g>
    <g transform="translate(216,0)"><circle cx="22" cy="22" r="20" fill="#264c3f" fill-opacity=".4"/><text x="22" y="28" fill="#F7FAF8" fill-opacity=".7" font-size="13" font-weight="700" text-anchor="middle">T</text><text x="22" y="60" fill="#F7FAF8" fill-opacity=".62" font-size="9" text-anchor="middle">Tadas</text></g>
  </g>

  <!-- Amount card -->
  <rect x="16" y="194" width="248" height="100" rx="18" fill="#264c3f" fill-opacity=".18" stroke="#2E7D52" stroke-opacity=".22"/>
  <text x="140" y="216" fill="#F7FAF8" fill-opacity=".5" font-size="9" font-weight="700" letter-spacing="1.4" text-anchor="middle">AMOUNT · USD</text>
  <text x="89" y="262" fill="#F7FAF8" fill-opacity=".62" font-size="36" font-weight="800" letter-spacing="-1.5">$</text>
  <text x="113" y="262" fill="#F7FAF8" font-size="36" font-weight="800" letter-spacing="-1.5">450</text>
  <text x="180" y="262" fill="#F7FAF8" fill-opacity=".4" font-size="22" font-weight="700">.00</text>
  <text x="140" y="284" fill="#F7FAF8" fill-opacity=".62" font-size="10" text-anchor="middle">Available · $12,840.50</text>

  <!-- Keypad -->
  <rect x="16" y="306" width="248" height="190" rx="18" fill="#264c3f" fill-opacity=".18" stroke="#2E7D52" stroke-opacity=".22"/>
  <g font-size="20" fill="#F7FAF8" font-weight="500" text-anchor="middle">
    <text x="59" y="342">1</text><text x="140" y="342">2</text><text x="221" y="342">3</text>
    <text x="59" y="386">4</text><text x="140" y="386">5</text><text x="221" y="386">6</text>
    <text x="59" y="430">7</text><text x="140" y="430">8</text><text x="221" y="430">9</text>
    <text x="59" y="474">.</text><text x="140" y="474">0</text><text x="221" y="474" font-size="16">⌫</text>
  </g>

  <!-- Slide to send -->
  <rect x="16" y="510" width="248" height="52" rx="26" fill="url(#slide)"/>
  <rect x="16" y="510" width="40" height="52" rx="26" fill="#fff" fill-opacity=".12"/>
  <text x="160" y="542" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Slide to send $450 to Mike</text>
  <circle cx="42" cy="536" r="22" fill="#fff"/>
  <text x="42" y="544" fill="#2E7D52" font-size="18" font-weight="800" text-anchor="middle">→</text>
</svg>
