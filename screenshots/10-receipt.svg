<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 580" width="280" height="580" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <radialGradient id="ar" cx="85%" cy="90%" r="70%"><stop offset="0%" stop-color="#2E7D52" stop-opacity=".22"/><stop offset="100%" stop-color="#2E7D52" stop-opacity="0"/></radialGradient>
    <linearGradient id="btnR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a8f63"/><stop offset="100%" stop-color="#2E7D52"/></linearGradient>
    <radialGradient id="successHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4CAF7A" stop-opacity=".5"/><stop offset="100%" stop-color="#4CAF7A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="280" height="580" rx="36" fill="#0a121b"/>
  <rect x="6" y="6" width="268" height="568" rx="30" fill="#1C2B3A"/>
  <rect x="6" y="6" width="268" height="568" rx="30" fill="url(#ar)"/>
  <text x="24" y="30" fill="#F7FAF8" font-size="10" font-weight="600">9:41</text>
  <rect x="256" y="20" width="14" height="8" rx="2" stroke="#F7FAF8" stroke-width="1" fill="none"/><rect x="258" y="22" width="9" height="4" fill="#F7FAF8"/>

  <rect x="20" y="50" width="34" height="34" rx="17" fill="#2E7D52" fill-opacity=".15" stroke="#2E7D52" stroke-opacity=".25"/>
  <text x="32" y="73" fill="#F7FAF8" font-size="16" font-weight="700">←</text>
  <text x="64" y="68" fill="#F7FAF8" font-size="18" font-weight="800" letter-spacing="-.5">Receipt</text>

  <!-- Success halo + check -->
  <circle cx="140" cy="172" r="80" fill="url(#successHalo)"/>
  <circle cx="140" cy="172" r="40" fill="#4CAF7A"/>
  <text x="140" y="184" fill="#F7FAF8" font-size="34" font-weight="900" text-anchor="middle">✓</text>

  <text x="140" y="246" fill="#F7FAF8" fill-opacity=".5" font-size="9" font-weight="700" letter-spacing="1.4" text-anchor="middle">SENT SUCCESSFULLY</text>

  <text x="100" y="290" fill="#F7FAF8" fill-opacity=".5" font-size="22" font-weight="800" letter-spacing="-1">$</text>
  <text x="116" y="290" fill="#F7FAF8" font-size="34" font-weight="800" letter-spacing="-1.2">450</text>
  <text x="170" y="290" fill="#F7FAF8" fill-opacity=".5" font-size="22" font-weight="800">.00</text>

  <text x="140" y="312" fill="#F7FAF8" fill-opacity=".62" font-size="11" text-anchor="middle">to Mike · May 4</text>

  <!-- Detail card -->
  <rect x="16" y="338" width="248" height="160" rx="18" fill="#264c3f" fill-opacity=".18" stroke="#2E7D52" stroke-opacity=".22"/>
  <g font-size="11" fill="#F7FAF8" font-weight="500">
    <g><text x="32" y="362">From</text><text x="248" y="362" text-anchor="end">Signature ••5025</text></g>
    <line x1="32" y1="372" x2="248" y2="372" stroke="#F7FAF8" stroke-opacity=".08"/>
    <g><text x="32" y="392">To</text><text x="248" y="392" text-anchor="end">Mike</text></g>
    <line x1="32" y1="402" x2="248" y2="402" stroke="#F7FAF8" stroke-opacity=".08"/>
    <g><text x="32" y="422">Amount</text><text x="248" y="422" text-anchor="end">$450.00</text></g>
    <line x1="32" y1="432" x2="248" y2="432" stroke="#F7FAF8" stroke-opacity=".08"/>
    <g><text x="32" y="452">Fee</text><text x="248" y="452" text-anchor="end">$0.00</text></g>
    <line x1="32" y1="462" x2="248" y2="462" stroke="#F7FAF8" stroke-opacity=".08"/>
    <g><text x="32" y="482">Reference</text><text x="248" y="482" text-anchor="end" font-family="monospace">APR-9F2C7K</text></g>
  </g>

  <!-- Buttons -->
  <rect x="16" y="514" width="80" height="48" rx="24" fill="#264c3f" fill-opacity=".25" stroke="#2E7D52" stroke-opacity=".25"/>
  <text x="56" y="544" fill="#F7FAF8" font-size="13" font-weight="600" text-anchor="middle">↓ PDF</text>

  <rect x="104" y="514" width="160" height="48" rx="24" fill="url(#btnR)"/>
  <text x="184" y="544" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">⌂ Back to Home</text>
